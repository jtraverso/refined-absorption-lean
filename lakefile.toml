name = "refined_absorption"
version = "0.1.0"
requiresModuleSystem = true
defaultTargets = ["RefinedAbsorption", "checks", "Palomar"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "c55e6e786f49471c72fbddbec5415808896aec1e"

[[lean_lib]]
name = "RefinedAbsorption"
globs = ["RefinedAbsorption", "RefinedAbsorption.+"]
moreLeanArgs = ["-j1", "-M4096", "-DmaxHeartbeats=1600000", "-DmaxRecDepth=8192"]

[[require]]
name = "nash_williams_paper_i"
git = "https://github.com/jtraverso/nash-williams-lean"
rev = "2603197abdbf0a600ec663f6f046f70fbd209d4a"

[[lean_lib]]
name = "checks"
globs = ["checks.+"]
moreLeanArgs = ["-j1", "-M4096", "-DmaxHeartbeats=1600000", "-DmaxRecDepth=8192"]

[[lean_lib]]
name = "Palomar"
globs = ["Palomar.+"]
moreLeanArgs = ["-j1", "-M4096", "-DmaxHeartbeats=1600000", "-DmaxRecDepth=8192"]
