version: v0.4
project:
  authors:
  - Juan Pablo Traverso Gianini
  license: Apache-2.0
  responsible_maintainers:
  - Juan Pablo Traverso Gianini
  name: 'Refined absorption: refiners, reserve matchings and compatible decompositions'
  description: Formalization of the refined omni-absorber and refiner theorems of Delcourt–Postle,
    the reserve-matching theorem for labelled multi-hypergraphs, and the dense decomposition
    theorem with compatibility against a prescribed packing. The compatible absorber endpoint
    explicitly keeps the entire old vertex set independent, including isolated labels. The
    original support-based endpoint is retained. The construction follows the refined absorption
    framework and gives an explicit deduction of compatible absorbers from dense decomposition
    results. Constants and order thresholds are existential.
