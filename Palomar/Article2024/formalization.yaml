fidelity:
  divergences: The 2024 article's theorem numbers are used. Hypergraphs in the 1.7 and 1.11
    interfaces carry explicit vertex sets, including isolated vertices. Refined families retain
    bounded edge usage, bounded member size and the separate refinement-degree bound. The
    2.8 endpoint allows labelled parallel copies and does not add disjointness of the named
    sets A and B. The added 6.2 endpoint retains all previous conclusions and additionally
    makes the whole old ambient set independent; it does not require the absorber to avoid
    old vertices altogether. Theorems quantify over ordinary finite objects in universe 0.
    This is a selection of principal statements, not a claim that every statement of the article
    is compared.
