fidelity:
  divergences: The statement baseline is arXiv:2510.19978v1; the DOI identifies its published
    ICM 2026 edition. Definitions 3.6–3.7 and Lemma 3.8 were also checked in that edition.
    The literal global embedding conclusion is refuted, not proved. The proved replacement
    permits separate injective maps on pieces with distinct images of new edges. The existence
    endpoint produces a finite set of blocks for every fixed λ ≥ 1, without repeated blocks.
    General high-girth and other applications announced in the survey are outside this compared
    scope. Thresholds are existential.
alignment:
  statements:
  - source: Postle survey, arXiv:2510.19978v1 and ICM 2026 edition, Theorem 1.10 (refined
      efficient omni-absorber).
    lean: RefinedAbsorption.Final.theorem_1_10
    module: Palomar.Survey2025Challenge
    status: proved
  - source: Postle survey, Conjecture 1.1, proved existence statement for every fixed index
      λ ≥ 1; simple block family.
    lean: RefinedAbsorption.existenceConjecture_proved
    module: Palomar.Survey2025Challenge
    status: proved
  - source: Steiner special case λ = 1 of the survey's Conjecture 1.1.
    lean: RefinedAbsorption.Final.existenceConjecture_steiner
    module: Palomar.Survey2025Challenge
    status: proved
  - source: Counterexample to the global-injection reading of survey Definition 3.7 and Lemma
      3.8, both checked in the arXiv and ICM editions. The selected theorem proves its negation.
    lean: RefinedAbsorption.FaithfulSurvey2025.not_generalEmbeddingLemmaLiteral
    module: Palomar.Survey2025Challenge
    status: proved
  - source: Proved piecewise replacement for survey Lemma 3.8, with new-edge distinctness;
      not the printed global-injection conclusion.
    lean: RefinedAbsorption.FaithfulSurvey2025.generalEmbedding_piecewise
    module: Palomar.Survey2025Challenge
    status: proved
