  - 05C70
automation:
  methods:
  - method: agent
    models:
    - Aristotle (Harmonic)
    framework: Aristotle
    tool_setup: Under the author's direction, explored constructions, developed and formalized
      proofs, and checked extensions. Its contribution was not limited to translation of finished
      proofs.
  - method: agent
    models:
    - Codex (OpenAI)
    framework: Codex
    tool_setup: Migrated the retained development, assembled pinned proved inputs, exposed
      ambient independence in an additive 6.2 interface, reviewed source fidelity and consequences,
      prepared the manuscripts and reproducibility evidence, and performed the internal audit.
