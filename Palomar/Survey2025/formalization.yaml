version: v0.4
project:
  authors:
  - Juan Pablo Traverso Gianini
  license: Apache-2.0
  responsible_maintainers:
  - Juan Pablo Traverso Gianini
  name: 'Refined absorption: design existence and the piecewise embedding interface'
  description: Formalization of the refined efficient omni-absorber framework and existence
    of simple designs for every fixed q > r ≥ 2 and index λ ≥ 1 at all sufficiently large
    admissible orders. The development separately defines global injectivity, injectivity
    on individual pieces and distinctness of new edges in supergraph embeddings. It proves
    the piecewise embedding variant used by the formal constructions and a counterexample
    to the literal global embedding conclusion in the survey. The distinction is part of the
    formal statement, rather than an additional hypothesis left implicit.
