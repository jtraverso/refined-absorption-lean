  name: 'Formalizing refined absorption: completion, intersections and polynomial schedules'
  description: 'Formal consequences of refined absorption: completion of a sparse partial
    Steiner system while avoiding an arbitrary forbidden partial system, prescribed sparse
    intersections, embedding a finite partial system as the exact intersection of two systems
    at every sufficiently large admissible order, and an initial intersection spectrum of
    order n^r. For fixed q > r ≥ 2, every sufficiently large Steiner system also admits a
    partition into partial parallel classes using at most R + R^(1−γ) classes, where R is
    its point degree. At the exact Nash–Williams minimum-degree threshold, triangle decompositions
    admit schedules with at most Δ(G)/2 + (Δ(G)/2)^(1−γ) rounds of vertex-disjoint triangles.
    The colouring and decomposition inputs are discharged by pinned proved theorems.'
