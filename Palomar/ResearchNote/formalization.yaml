fidelity:
  divergences: Completion sparsity concerns the maximum (r−1)-degree of the covered r-edges;
    the forbidden partial system need not be sparse. The additional crossing guarantee in
    completion is restricted to forbidden blocks whose r-edges avoid the prescribed covered
    edges. The spectrum chooses both systems and supplies an initial interval k ≤ c n^r, not
    a complete spectrum. Disjoint mates have no common blocks; classical orthogonality is
    not asserted. Polynomial error bounds count partial parallel classes or schedule rounds,
    and do not assert perfect classes or a deficit bound for every round. The external polynomial
    colouring theorem assumes a maximum-degree bound, a polynomial codegree bound and an exponential
    edge-count cap; all are verified before application. The closed endpoints have no external
    theorem hypotheses. The original conditional consumers remain unchanged.
