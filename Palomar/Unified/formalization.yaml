fidelity:
  divergences: The canonical submission uses Palomar/Unified.comparator.json, a standalone
    Mathlib-only Challenge and the existing RefinedAbsorption aggregate root as its Solution.
    It compares all eighteen selected declarations in one entry. The three narrower configurations
    are retained as historical/optional views, not three intended submissions. The 2024 article's
    theorem numbers are used. Hypergraphs in the 1.7 and 1.11 interfaces carry explicit vertex
    sets, including isolated vertices. Refined families retain bounded edge usage, bounded
    member size and the separate refinement-degree bound. The 2.8 endpoint allows labelled
    parallel copies and does not add disjointness of the named sets A and B. The added 6.2
    endpoint retains all previous conclusions and additionally makes the whole old ambient
    set independent; it does not require the absorber to avoid old vertices altogether. Theorems
    quantify over ordinary finite objects in universe 0. This is a selection of principal
    statements, not a claim that every statement of the article is compared. The statement
    baseline is arXiv:2510.19978v1; the DOI identifies its published ICM 2026 edition. Definitions
    3.6–3.7 and Lemma 3.8 were also checked in that edition. The literal global embedding
    conclusion is refuted, not proved. The proved replacement permits separate injective maps
    on pieces with distinct images of new edges. The existence endpoint produces a finite
    set of blocks for every fixed λ ≥ 1, without repeated blocks. General high-girth and other
    applications announced in the survey are outside this compared scope. Thresholds are existential.
    Completion sparsity concerns the maximum (r−1)-degree of the covered r-edges; the forbidden
    partial system need not be sparse. The additional crossing guarantee in completion is
    restricted to forbidden blocks whose r-edges avoid the prescribed covered edges. The spectrum
    chooses both systems and supplies an initial interval k ≤ c n^r, not a complete spectrum.
    Disjoint mates have no common blocks; classical orthogonality is not asserted. Polynomial
    error bounds count partial parallel classes or schedule rounds, and do not assert perfect
    classes or a deficit bound for every round. The external polynomial colouring theorem
    assumes a maximum-degree bound, a polynomial codegree bound and an exponential edge-count
    cap; all are verified before application. The closed endpoints have no external theorem
    hypotheses. The original conditional consumers remain unchanged.
