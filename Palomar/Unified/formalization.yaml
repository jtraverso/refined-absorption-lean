  name: 'Formalizing Delcourt–Postle’s refined absorption in Lean'
  description: One assembled Lean formalization of principal refined absorption results and
    their consequences. The selected results include refined omni-absorbers and refiners,
    labelled reserve matchings, dense compatible decompositions, an additive compatible-absorber
    interface retaining independence of the entire old ambient vertex set, and existence of
    simple designs for every fixed q > r ≥ 2 and index λ ≥ 1 at all sufficiently large admissible
    orders. The literal global embedding conclusion of the survey is refuted separately from
    a proved piecewise replacement. The research-note endpoints give completion avoiding an
    arbitrary forbidden partial Steiner system, sparse prescribed and finite embedded exact
    intersections, an initial polynomial intersection interval, and polynomial excess in partial
    parallel classes and Nash–Williams schedule rounds. Both external inputs are supplied
    by pinned proved theorems. The single comparison selects eighteen declarations from the
    existing aggregate proof root.
